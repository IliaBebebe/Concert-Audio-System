name: Build release packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }} package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            command: npm run build:win
            artifact: windows
            files: release/Concert-Audio-System-Setup.exe
          - name: macOS
            os: macos-latest
            command: npm run build:mac
            artifact: macos
            files: release/Concert-Audio-System-macOS.dmg
          - name: Linux
            os: ubuntu-latest
            command: npm run build:linux
            artifact: linux
            files: |
              release/Concert-Audio-System-linux.AppImage
              release/Concert-Audio-System-linux.deb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check release version
        run: node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) throw new Error('Tag and package version differ')"
      - run: npm test
      - name: Prepare verified online music tools
        run: npm run prepare:online
      - name: Check native online music tools
        run: npm run check:online
      - name: Build package
        run: ${{ matrix.command }}
      - name: Verify packaged online music tools
        run: node scripts/check-packaged-online.js
      - name: Verify packaged workspace interface and assets
        run: node scripts/check-packaged-ui.js
      - name: Verify universal macOS executable
        if: runner.os == 'macOS'
        run: lipo "release/mac-universal/Concert Audio System.app/Contents/MacOS/Concert Audio System" -verify_arch x86_64 arm64
      - name: Verify Linux Debian architecture
        if: runner.os == 'Linux'
        run: test "$(dpkg-deb --field release/Concert-Audio-System-linux.deb Architecture)" = amd64
      - name: Test native application startup and playback
        if: runner.os != 'Linux'
        run: node scripts/smoke-packaged.js
      - name: Test native application startup and playback on Linux
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum node scripts/smoke-packaged.js
      - uses: actions/upload-artifact@v4
        with:
          name: cas-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Verify all platform packages and release notes
        run: |
          test -s "docs/releases/${GITHUB_REF_NAME}.md"
          for file in Concert-Audio-System-Setup.exe Concert-Audio-System-macOS.dmg Concert-Audio-System-linux.AppImage Concert-Audio-System-linux.deb; do
            test -s "release-files/$file" || exit 1
          done
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Concert Audio System ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: release-files/*
