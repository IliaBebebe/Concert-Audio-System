name: Build release packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }} package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            command: npm run build:win
            artifact: windows
            files: release/Concert-Audio-System-Setup.exe
          - name: macOS
            os: macos-latest
            command: npm run build:mac
            artifact: macos
            files: release/Concert-Audio-System-macOS.dmg
          - name: Linux
            os: ubuntu-latest
            command: npm run build:linux
            artifact: linux
            files: |
              release/Concert-Audio-System-linux.AppImage
              release/Concert-Audio-System-linux.deb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Windows package
        if: matrix.artifact == 'windows'
        run: ${{ matrix.command }}
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      - name: Build macOS package
        if: matrix.artifact == 'macos'
        run: ${{ matrix.command }}
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Build Linux package
        if: matrix.artifact == 'linux'
        run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: cas-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-files/*
