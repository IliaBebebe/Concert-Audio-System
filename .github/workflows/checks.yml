name: Check application

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Check JavaScript syntax
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer.js
          node --check workspaces.js
          node --check metadata-worker.js
          node --check welcome.js
          node --check online-music.js
          node --check online-ui.js
          node --check scripts/prepare-online-tools.js
